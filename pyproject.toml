[project]
name = "imagenet-classification"
version = "0.1.0"
description = "Knowledge distillation of classifier on ImageNet dataset."
requires-python = ">=3.12"          # tiatoolbox 2.1.3 needs >=3.12, For ref DCS supports 3.7 up (inc 3.14)
dependencies = [
    "torch",
    "torchvision",
    "pyyaml",
    "tiatoolbox>=2.1.3",
    "matplotlib",
    "fvcore", # Utilities for computer vision
    "ruff", # Code linting
    "pytest",
    "pyarrow>=26.0.1",
    "pandas>=3.0.2",
    "torchmetrics>=1.9.0",
    "pydantic", # For YAML Validation
    "jinja2" # For Batch Compute
]

# Enable (optionally) Jupyter Notebooks
[project.optional-dependencies]
examples = [
    "ipykernel>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Enforce Ruff Linting
[tool.ruff]
line-length = 88
target-version = "py312"

# Rules
# E = pycodestyle errors (Pythonistic code)
# F = pyflakes, Potential Bugs
# I = Isort (consistent imports)
# UP = pyupgrade (Modern version code)
# B = flake8-bugbear (Find Unexpected behaviour)
# SIM = flake8-simplify (Reduce Code to Simpler forms)
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]  # shared test helpers, imported by name

[tool.setuptools.packages.find]
where = ["."]
include = ["lwfm*"]