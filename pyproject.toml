[project]
name = "imagenet-classification"
version = "0.1.0"
description = "Knowledge distillation of classifier on ImageNet dataset."
requires-python = ">=3.12"          # tiatoolbox 2.1.3 needs >=3.12
dependencies = [
    "torch",
    "torchvision",
    "pyyaml",
    "tiatoolbox>=2.1.3",
    "matplotlib",
    "fvcore",
    "ruff",
    "pytest",
    "pyarrow>=26.0.1",
]

[project.optional-dependencies]
examples = [
    "ipykernel>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
