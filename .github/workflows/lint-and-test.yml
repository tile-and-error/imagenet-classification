name: Lint and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # non-blocking until existing errors are cleared
    steps:
      - uses: actions/checkout@v4
      # Ruff version follows the `ruff` requirement in pyproject.toml.
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
      - if: ${{ !cancelled() }} # report format issues even if lint failed
        run: ruff format --check --diff

  test:
    name: Pytest
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  typecheck:
    name: Pyright
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # non-blocking until existing errors are cleared
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pyright
