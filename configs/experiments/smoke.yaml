name: smoke_resnet18
seed: 42
device: cpu
model:
  node: student # node name; outputs are student.<write>
  inputs: inputs.image
  outputs: logits
  type: torchvision
  name: resnet18
  num_classes: 10
  pretrained: false
  preprocess:
    resize: [64, 64] # becomes v2.Resize + v2.Normalize in front of the model
    normalization:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
data:
  type: fake_classification
  num_classes: 10
  num_train: 32
  num_val: 16
  image_size: [64, 64]

  batch_size: 8
  num_workers: 0
losses:
  - name: ce
    type: cross_entropy
    inputs: [student.logits, targets.class] # CrossEntropyLoss(input, target)
    weight: 1.0
metrics:
  - name: top1
    type: topk_accuracy # micro average (§3.6)
    inputs: [student.logits, targets.class] # update(preds, target)
    kwargs:
      top_k: 1
      num_classes: 10
      average: micro
  - name: top5
    type: topk_accuracy
    inputs: [student.logits, targets.class]
    kwargs:
      top_k: 5
      num_classes: 10
      average: micro
training:
  optimizer: { name: sgd, lr: 0.01 }
  max_epochs: 1
  max_steps: 2
  scheduler: 
    name: cosine_annealing_lr
    interval: step
recipe:
  stages:
    - { name: fit, type: fit }
    - { name: eval_val, type: evaluate, split: val }
    - { name: bench, type: benchmark, warmup: 2, repeats: 5, batch_size: 1 }
outputs:
  root: runs
  sinks: [local, console]
deployment:
  node: student
